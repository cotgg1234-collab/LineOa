<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เพิ่มสินค้า — ร้านค้า POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=22" />
</head>
<body>
<main class="admin">
  <!-- ฟอร์มเพิ่ม / แก้ไข -->
  <section class="panel form-panel">
    <h2 id="formTitle">เพิ่มสินค้าใหม่</h2>

    <form id="productForm" novalidate>
      <input type="hidden" id="originalSku" />

      <div class="photo-field">
        <label class="photo-pick" for="fImage" id="photoPick">
          <img id="photoPreview" alt="" hidden />
          <span class="photo-empty" id="photoEmpty"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><small>แตะเพื่อถ่าย / เลือกรูป</small></span>
        </label>
        <input id="fImage" type="file" accept="image/*" hidden />
        <button type="button" class="link-btn" id="photoRemove" hidden>ลบรูป</button>
      </div>

      <div class="field">
        <label for="fName">ชื่อสินค้า <span class="req">*</span></label>
        <input id="fName" type="text" placeholder="เช่น น้ำส้มคั้น 350 มล." required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fPrice">ราคา (บาท) <span class="req">*</span></label>
          <input id="fPrice" type="number" inputmode="decimal" min="0" step="1" placeholder="25" required />
        </div>
        <div class="field">
          <label for="fStock">จำนวน</label>
          <input id="fStock" type="number" inputmode="numeric" min="0" step="1" placeholder="0" />
        </div>
      </div>


      <p class="form-error" id="formError" hidden></p>

      <div class="form-actions">
        <button type="submit" class="pay-btn" id="submitBtn">เพิ่มสินค้า</button>
        <button type="button" class="ghost-btn" id="cancelEdit" hidden>ยกเลิกการแก้ไข</button>
      </div>
    </form>
  </section>

  <!-- ตารางรายการสินค้า -->
  <section class="panel list-panel">
    <div class="list-head">
      <h2>รายการสินค้า <span class="count" id="count">0</span></h2>
      <div class="list-tools">
        <input id="filter" type="search" class="filter-input" placeholder="กรองรายการ…" autocomplete="off" />
        <button class="mini-btn" id="lowOnly" type="button" aria-pressed="false">เฉพาะใกล้หมด</button>
        <button class="mini-btn" id="fillStock" type="button">เติมสต็อกทั้งหมด</button>
        <button class="mini-btn" id="addNew" type="button">เพิ่มสินค้า</button>
        <button class="link-btn" id="resetStore" type="button">ล้างสินค้าทั้งหมด</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>รูป</th><th>รหัส</th><th>ชื่อสินค้า</th><th class="right">ราคา</th><th class="right">คงเหลือ</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <p class="empty" id="listEmpty" hidden>ยังไม่มีสินค้า — เพิ่มจากฟอร์มด้านบน</p>
    </div>
  </section>
</main>

<!-- QR ของสินค้า (ติดที่สินค้า/ชั้นวาง เพื่อสแกนขาย) -->
<div class="modal" id="qrModal" hidden>
  <div class="modal-card qr-card" role="dialog" aria-modal="true" aria-labelledby="qrAdded">
    <button class="close-x" id="qrX" type="button" aria-label="ปิด">✕</button>
    <p class="qr-added" id="qrAdded">QR สินค้า</p>
    <div class="qr-box"><img id="qrImg" alt="" /></div>
    <p class="qr-hint">กดค้างที่รูปเพื่อบันทึกได้เช่นกัน</p>
    <button class="pay-btn" id="qrDownload" type="button">ดาวน์โหลด QR</button>
    <button class="scan-more" id="qrAddNext" type="button">เพิ่มสินค้า</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="store.js?v=18"></script>
<script src="products.js?v=21"></script>
</body>
</html>
