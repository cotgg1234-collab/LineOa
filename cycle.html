<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>รอบสั่งของ — ร้านค้า POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=37" />
</head>
<body class="big-ui">
<main class="report cycle-page">
  <!-- สถานะรอบ -->
  <section class="panel cycle-head" id="cycleHead"></section>

  <!-- ใบสั่งของ / รับของ -->
  <section class="panel">
    <h2 class="big-title" id="listTitle">ใบสั่งของรอบนี้</h2>

    <ul class="order-list" id="orderList"></ul>
    <p class="empty" id="orderEmpty" hidden></p>

    <div class="order-actions" id="orderActions"></div>
  </section>


  <!-- ของที่รับเข้ามาแต่ละรอบ -->
  <section class="panel">
    <h2 class="big-title">ของที่รับเข้ามาแต่ละรอบ</h2>
    <ul class="round-list" id="historyList"></ul>
    <p class="empty" id="historyEmpty" hidden>ยังไม่มีรอบที่รับของแล้ว</p>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="store.js?v=33"></script>
<script src="cycle.js?v=35"></script>
</body>
</html>
