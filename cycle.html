<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>รอบสั่งของ — ร้านค้า POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🔄</span>
    <div>
      <h1>รอบสั่งของ</h1>
      <p class="sub">สั่งของ · ไปรับ · เติมสต็อก</p>
    </div>
  </div>

  <nav class="nav">
    <a class="nav-link" href="index.html">🛒 ขาย</a>
    <a class="nav-link active" href="cycle.html">🔄 รอบสั่งของ</a>
    <a class="nav-link" href="sales.html">📊 ยอดขาย</a>
    <a class="nav-link" href="products.html">📦 สินค้า</a>
  </nav>
</header>

<main class="report">
  <!-- สถานะรอบ -->
  <section class="panel cycle-head" id="cycleHead"></section>

  <!-- ใบสั่งของ / รับของ -->
  <section class="panel">
    <div class="list-head">
      <h2 id="listTitle">ใบสั่งของรอบนี้</h2>
      <div class="list-tools" id="listTools"></div>
    </div>

    <p class="basis-note" id="basisNote"></p>

    <div class="table-wrap">
      <table class="table order-table">
        <thead id="orderHead"></thead>
        <tbody id="orderBody"></tbody>
      </table>
      <p class="empty" id="orderEmpty" hidden></p>
    </div>

    <div class="order-actions" id="orderActions"></div>
  </section>

  <!-- ประวัติรอบที่ผ่านมา -->
  <section class="panel">
    <div class="list-head"><h2>ประวัติรอบที่ผ่านมา</h2></div>
    <ul class="bill-list" id="historyList"></ul>
    <p class="empty" id="historyEmpty" hidden>ยังไม่มีรอบที่ปิดแล้ว</p>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="store.js?v=7"></script>
<script src="cycle.js?v=7"></script>
</body>
</html>
